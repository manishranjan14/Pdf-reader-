<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>StudyMark v2 — PDF Reader</title>
<style>
:root{--bg:#f3f5f9;--card:#fff;--text:#172033;--muted:#667085;--line:#dfe3eb;--accent:#675df5}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}
header{height:62px;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:0 12px;position:sticky;top:0;z-index:50}
.logo{font-size:19px;font-weight:800;margin-right:6px}.logo b{color:var(--accent)}
button,.file{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 11px;font-weight:650;cursor:pointer}
button.active,.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.color{width:31px;height:31px;padding:0;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #ccd1dc}.yellow{background:#ffe45e}.green{background:#71dfa0}.pink{background:#ff8fb0}.blue{background:#7eb3ff}
.spacer{flex:1}.status{font-size:12px;color:var(--muted);white-space:nowrap}
main{display:grid;grid-template-columns:minmax(0,1fr) 300px;height:calc(100vh - 62px)}
.viewer{overflow:auto;padding:18px;text-align:center;position:relative}.page{position:relative;background:#fff;margin:0 auto 20px;display:block;width:max-content;box-shadow:0 4px 18px #0002}
.page canvas{display:block}.layer{position:absolute;inset:0;pointer-events:none}
.mark{position:absolute;opacity:.48;border-radius:2px;pointer-events:auto;cursor:pointer}
.mark.yellow{background:#ffe45e}.mark.green{background:#71dfa0}.mark.pink{background:#ff8fb0}.mark.blue{background:#7eb3ff}
.sidebar{background:#fff;border-left:1px solid var(--line);padding:15px;overflow:auto}.sidebar h3{margin:0 0 4px}.hint{font-size:12px;color:var(--muted)}
.note{padding:10px;border:1px solid var(--line);border-radius:10px;margin:8px 0;cursor:pointer;font-size:13px}.note:hover{background:#f7f8fc}.note small{color:var(--muted)}
.welcome{max-width:600px;margin:90px auto;text-align:center}.welcome h1{font-size:34px;margin:8px}.welcome p{color:var(--muted)}
.zoom{display:flex;align-items:center;gap:5px}
@media(max-width:800px){main{grid-template-columns:1fr}.sidebar{display:none}.viewer{padding:8px}header{overflow:auto}.logo{flex:none}.status{display:none}.page{margin-bottom:12px}}
</style>
</head>
<body>
<header>
<div class="logo">Study<b>Mark</b></div>
<label class="file primary">Open PDF<input id="file" type="file" accept="application/pdf" hidden></label>
<button id="highlight" class="active">🖍 Highlight</button>
<button class="color yellow" data-color="yellow" title="Yellow"></button>
<button class="color green" data-color="green" title="Green"></button>
<button class="color pink" data-color="pink" title="Pink"></button>
<button class="color blue" data-color="blue" title="Blue"></button>
<div class="zoom"><button id="minus">−</button><span id="zoom">125%</span><button id="plus">+</button></div>
<div class="spacer"></div><span id="status" class="status">Open a PDF</span>
</header>
<main>
<section class="viewer" id="viewer">
<div class="welcome"><h1>Read. Highlight. Remember.</h1><p>High-resolution PDF reader with automatic highlight saving.</p><label class="file primary">Choose PDF<input id="file2" type="file" accept="application/pdf" hidden></label></div>
</section>
<aside class="sidebar"><h3>⭐ Important Points</h3><div class="hint">Highlights auto-save as you make them.</div><div id="notes"></div></aside>
</main>

<script type="module">
import * as pdfjsLib from "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs";
pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.mjs";

const $=id=>document.getElementById(id), viewer=$("viewer"), notes=$("notes");
let pdf=null,fileKey="",marks=[],scale=1.25,currentColor="yellow",highlightMode=true;

$("file").onchange=e=>e.target.files[0]&&openPDF(e.target.files[0]);
$("file2").onchange=e=>e.target.files[0]&&openPDF(e.target.files[0]);

async function openPDF(file){
  fileKey="StudyMark:v2:"+file.name+":"+file.size;
  pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;
  marks=JSON.parse(localStorage.getItem(fileKey)||"[]");
  viewer.innerHTML="";
  $("status").textContent=file.name+" • "+pdf.numPages+" pages • auto-save ON";
  await renderAll();
  renderNotes();
}
async function renderAll(){
  viewer.innerHTML="";
  for(let n=1;n<=pdf.numPages;n++) await renderPage(n);
}
async function renderPage(n){
  const p=await pdf.getPage(n);
  const dpr=Math.min(3,window.devicePixelRatio||1);
  const vp=p.getViewport({scale:scale});
  const hi=p.getViewport({scale:scale*dpr});
  const wrap=document.createElement("div");wrap.className="page";wrap.id="page-"+n;
  const c=document.createElement("canvas");c.style.width=vp.width+"px";c.style.height=vp.height+"px";c.width=Math.ceil(hi.width);c.height=Math.ceil(hi.height);
  wrap.appendChild(c);
  const layer=document.createElement("div");layer.className="layer";wrap.appendChild(layer);viewer.appendChild(wrap);
  await p.render({canvasContext:c.getContext("2d"),viewport:hi}).promise;
  draw(n,layer);
  c.addEventListener("mouseup",()=>selectText(n,wrap));
  c.addEventListener("touchend",()=>setTimeout(()=>selectText(n,wrap),80));
}
function selectText(page,wrap){
  if(!highlightMode)return;
  const s=getSelection();let text=s.toString().trim();if(!text)return;
  const r=s.getRangeAt(0), rect=r.getBoundingClientRect(), base=wrap.getBoundingClientRect();
  const x=Math.max(0,(rect.left-base.left)/base.width), y=Math.max(0,(rect.top-base.top)/base.height);
  const w=Math.min(1-x,rect.width/base.width), h=Math.max(.012,Math.min(1-y,rect.height/base.height));
  marks.push({id:crypto.randomUUID(),page,text,color:currentColor,x,y,w,h});
  autoSave();draw(page,wrap.querySelector(".layer"));renderNotes();s.removeAllRanges();
}
function draw(page,layer){
  layer.innerHTML="";
  marks.filter(m=>m.page===page).forEach(m=>{
    const e=document.createElement("div");e.className="mark "+m.color;
    e.style.left=m.x*100+"%";e.style.top=m.y*100+"%";e.style.width=m.w*100+"%";e.style.height=m.h*100+"%";e.title="Tap to remove";
    e.onclick=ev=>{ev.stopPropagation();marks=marks.filter(x=>x.id!==m.id);autoSave();draw(page,layer);renderNotes()};layer.appendChild(e);
  });
}
function autoSave(){localStorage.setItem(fileKey,JSON.stringify(marks))}
function renderNotes(){
  notes.innerHTML=marks.length?"":"<p class='hint'>No highlights yet. Select important text in Highlight mode.</p>";
  marks.forEach(m=>{
    const e=document.createElement("div");e.className="note";
    e.innerHTML="<b>Page "+m.page+"</b><br>"+esc(m.text.slice(0,220))+(m.text.length>220?"…":"")+"<br><small>"+m.color+" • saved automatically</small>";
    e.onclick=()=>document.getElementById("page-"+m.page)?.scrollIntoView({behavior:"smooth",block:"center"});notes.appendChild(e);
  });
}
function esc(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
$("highlight").onclick=()=>{highlightMode=!highlightMode;$("highlight").classList.toggle("active",highlightMode)}
document.querySelectorAll(".color").forEach(b=>b.onclick=()=>{currentColor=b.dataset.color;highlightMode=true;$("highlight").classList.add("active")});
$("plus").onclick=()=>{if(!pdf)return;scale=Math.min(3,scale+.15);$("zoom").textContent=Math.round(scale*100)+"%";renderAll()};
$("minus").onclick=()=>{if(!pdf)return;scale=Math.max(.7,scale-.15);$("zoom").textContent=Math.round(scale*100)+"%";renderAll()};
</script>
</body></html>

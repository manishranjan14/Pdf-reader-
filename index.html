<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>StudyMark — PDF Highlighter</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#667085;--line:#e4e7ec;--accent:#675df5}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial,sans-serif;background:var(--bg);color:var(--text)}
header{height:64px;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 18px;position:sticky;top:0;z-index:20}
.logo{font-weight:800;font-size:20px}.logo span{color:var(--accent)}
button,.fileBtn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 13px;cursor:pointer;font-weight:600}
button:hover,.fileBtn:hover{background:#f1f3f9}.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
input[type=file]{display:none}.spacer{flex:1}.status{font-size:13px;color:var(--muted)}
main{height:calc(100vh - 64px);display:grid;grid-template-columns:1fr 310px}
.viewer{overflow:auto;padding:28px;text-align:center}.page{position:relative;margin:0 auto 22px;background:#fff;box-shadow:0 4px 18px #0001;display:inline-block;text-align:left}
.page canvas{display:block}.layer{position:absolute;inset:0;pointer-events:none}.highlight{position:absolute;opacity:.45;border-radius:3px;cursor:pointer;pointer-events:auto}
.yellow{background:#ffe45e}.green{background:#72e6a2}.pink{background:#ff8fb3}.blue{background:#82b7ff}
.sidebar{background:#fff;border-left:1px solid var(--line);padding:18px;overflow:auto}.sidebar h3{margin:0 0 8px}
.note{border:1px solid var(--line);border-radius:12px;padding:11px;margin:10px 0;background:#fafbff}.note small{color:var(--muted)}
.empty{color:var(--muted);font-size:14px;line-height:1.5}
.toolbar{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
select{border:1px solid var(--line);border-radius:9px;padding:8px;background:#fff}
.welcome{max-width:650px;margin:100px auto;text-align:center}.welcome h1{font-size:36px;margin:10px}.welcome p{color:var(--muted)}
@media(max-width:800px){main{grid-template-columns:1fr}.sidebar{display:none}.viewer{padding:12px}.toolbar{position:sticky;top:0;background:var(--bg);z-index:5;padding:5px}.status{display:none}}
</style>
</head>
<body>
<header>
  <div class="logo">Study<span>Mark</span></div>
  <label class="fileBtn primary">Open PDF<input id="pdfInput" type="file" accept="application/pdf"></label>
  <button id="saveBtn">Save Notes</button>
  <button id="clearBtn">Clear Highlights</button>
  <div class="spacer"></div><div id="status" class="status">Open a PDF to start</div>
</header>
<main>
<section class="viewer" id="viewer">
  <div class="welcome" id="welcome">
    <h1>Read. Highlight. Remember.</h1>
    <p>Open a PDF, select text with your mouse/finger, then choose a highlight color. Your marks are stored in this browser.</p>
    <label class="fileBtn primary">Choose PDF<input id="pdfInput2" type="file" accept="application/pdf"></label>
  </div>
</section>
<aside class="sidebar">
  <h3>Important Points</h3>
  <p class="empty">Highlights from your PDF will appear here. Click a point to jump to its page.</p>
  <div id="notes"></div>
</aside>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs" type="module"></script>
<script type="module">
import * as pdfjsLib from "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs";
pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.mjs";

const viewer=document.getElementById("viewer"), notes=document.getElementById("notes"), status=document.getElementById("status");
const input=document.getElementById("pdfInput"), input2=document.getElementById("pdfInput2");
let pdf=null, marks=[], pdfKey="";

[input,input2].forEach(i=>i.addEventListener("change",e=>e.target.files[0]&&loadFile(e.target.files[0])));

async function loadFile(file){
  pdfKey="studymark:"+file.name+":"+file.size;
  const data=await file.arrayBuffer();
  pdf=await pdfjsLib.getDocument({data}).promise;
  viewer.innerHTML="";
  marks=JSON.parse(localStorage.getItem(pdfKey)||"[]");
  status.textContent=`${file.name} • ${pdf.numPages} pages`;
  for(let n=1;n<=pdf.numPages;n++) await renderPage(n);
  renderNotes();
}

async function renderPage(n){
  const p=await pdf.getPage(n), scale=Math.min(1.65,Math.max(.8,innerWidth/900));
  const vp=p.getViewport({scale});
  const wrap=document.createElement("div"); wrap.className="page"; wrap.id="page-"+n;
  const canvas=document.createElement("canvas"); canvas.width=vp.width; canvas.height=vp.height;
  wrap.appendChild(canvas);
  const layer=document.createElement("div"); layer.className="layer"; wrap.appendChild(layer);
  viewer.appendChild(wrap);
  await p.render({canvasContext:canvas.getContext("2d"),viewport:vp}).promise;
  drawMarks(n,layer,vp);
  canvas.addEventListener("mouseup",()=>captureSelection(n,layer,vp));
  canvas.addEventListener("touchend",()=>setTimeout(()=>captureSelection(n,layer,vp),50));
}

function captureSelection(page,layer,vp){
  const sel=getSelection(); const text=sel.toString().trim();
  if(!text)return;
  const r=sel.getRangeAt(0), rect=r.getBoundingClientRect(), base=viewer.querySelector("#page-"+page).getBoundingClientRect();
  const x=(rect.left-base.left)/base.width, y=(rect.top-base.top)/base.height;
  const w=rect.width/base.width, h=Math.max(rect.height,16)/base.height;
  const color=prompt("Highlight color: yellow, green, pink, or blue","yellow");
  if(!["yellow","green","pink","blue"].includes(color)) return;
  marks.push({id:Date.now()+Math.random(),page,text,color,x,y,w,h});
  persist(); drawMarks(page,layer,vp); renderNotes(); sel.removeAllRanges();
}

function drawMarks(page,layer){
  layer.innerHTML="";
  const pageEl=document.getElementById("page-"+page);
  marks.filter(m=>m.page===page).forEach(m=>{
    const d=document.createElement("div"); d.className="highlight "+m.color;
    d.style.left=(m.x*100)+"%";d.style.top=(m.y*100)+"%";d.style.width=(m.w*100)+"%";d.style.height=(m.h*100)+"%";
    d.title=m.text; d.onclick=()=>removeMark(m.id); layer.appendChild(d);
  });
}
function persist(){localStorage.setItem(pdfKey,JSON.stringify(marks))}
function renderNotes(){
  notes.innerHTML="";
  if(!marks.length){notes.innerHTML='<p class="empty">No highlights yet. Select text in the PDF to add one.</p>';return}
  marks.forEach((m,i)=>{
    const d=document.createElement("div");d.className="note";
    d.innerHTML=`<b>Page ${m.page}</b><br><span>${escapeHtml(m.text.slice(0,180))}${m.text.length>180?"…":""}</span><br><small>${m.color} highlight • tap to jump • click highlight to remove</small>`;
    d.onclick=()=>document.getElementById("page-"+m.page)?.scrollIntoView({behavior:"smooth",block:"center"});
    notes.appendChild(d);
  });
}
function removeMark(id){marks=marks.filter(x=>x.id!==id);persist();document.querySelectorAll(".layer").forEach((l,i)=>drawMarks(i+1,l));renderNotes()}
document.getElementById("clearBtn").onclick=()=>{if(confirm("Remove all highlights for this PDF?")){marks=[];persist();document.querySelectorAll(".layer").forEach((l,i)=>drawMarks(i+1,l));renderNotes()}}
document.getElementById("saveBtn").onclick=()=>{persist();alert("Highlights saved in this browser for this PDF.")};
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
</script>
</body>
</html>
